# Module manifest. Shell-style KEY=value, one per line.
#
# Read — never sourced — by the PLAY patcher in the browser and by the
# installer on the device, so nothing here is executed. Quotes are optional.
#
# NAME     1–32 characters of a-z, 0-9 and -, starting with a letter or digit.
#          Becomes modules/<NAME>/ in the package and, by convention,
#          /userdata/bd-<NAME> and bd-<NAME>.service on the device. These are
#          taken: tailscale tailscale-ui kvm cam cam-api play probe modules.
# VERSION  1–32 characters of A-Z a-z 0-9 . _ + -. Logged on the device.
NAME=hello
VERSION=0.1.0
DESCRIPTION="Heartbeat example: proves a module installed and that its service runs"
HOMEPAGE=https://github.com/stoatworks-labs/bd-play-module-template
